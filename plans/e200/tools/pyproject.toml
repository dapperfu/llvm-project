[project]
name = "e200-tools"
version = "0.1.0"
description = "Evidence and coverage tooling for the LLVM PowerPC e200/VLE work"
requires-python = ">=3.11"
dependencies = [
    "click==8.1.8",
    "PyYAML==6.0.2",
]

[project.scripts]
e200-extract-vle-table = "extract_vle_table:main"
e200-build-inventory = "build_inventory:main"
e200-gen-mc-test = "gen_mc_test:main"
e200-diff-mc-vs-gnu = "diff_mc_vs_gnu:main"
e200-gen-vle-shared = "gen_vle_shared:main"
e200-vle-length-sweep = "vle_length_sweep:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
