# e200 processor capability matrix (deliverable B of plans/ppc-e200-vle-toolchain.md).
#
# Status values: supported | unsupported | unverified.  "unverified" means the
# cited manual is silent; it is never treated as supported.  Page numbers are
# PDF pages of the cited manual unless the value starts with a section sign.
#
# `categories` uses the Power ISA / EREF category names that VLEPEM Table B-2
# assigns to each instruction (column "Cat"); tools/build_inventory.py applies
# them to every inventory row, and per-mnemonic `exceptions` override them.
schema: 1
documents:
  E200Z0: {id: e200z0CORERM, rev: "Rev. 0, 4/2008", file: E200Z0.pdf}
  E200Z1: {id: e200z1RM, rev: "Rev. 0, 09/2008", file: e200z1RM.pdf}
  E200Z3: {id: "UM0434 (DocID13527)", rev: "Rev 2, 11/2013", file: um0434-e200z3-powerpc-core-reference-manual-stmicroelectronics.pdf}
  E200Z4: {id: e200z4RM, rev: "Rev. 0, 10/2009", file: e200Z4.pdf}
  E200Z6: {id: e200z6RM, rev: "Rev. 0, 6/2004 (preliminary)", file: E200Z6_RM.pdf}
  E200Z759: {id: e200z759n3CRM, rev: "Rev. 2, 01/2015", file: e200z759CRM.pdf}
  E200Z760: {id: e200z760RM, rev: "Rev. 2, 06/2012", file: e200z760RM.pdf}
  VLEPEM: {id: VLEPEM, rev: "Rev. 0, 07/2007", file: VLEPEM.pdf}

